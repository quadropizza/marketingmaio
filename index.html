<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadrô Pizza — Hoje</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#CC1F1F;--redd:#9B1515;--yellow:#F5C842;--black:#111;--cream:#FFF8F0;--cream2:#F0E8DC;--white:#fff;--green:#1D9E75;--blue:#185FA5;--gray:#777;--shadow:0 4px 24px rgba(0,0,0,0.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--cream);color:var(--black);min-height:100vh}

/* HEADER */
.hdr{background:var(--red);padding:0;box-shadow:0 4px 0 var(--redd)}
.hdr-in{max-width:700px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Black Ops One',sans-serif;font-size:20px;color:var(--yellow);display:flex;align-items:center;gap:6px}
.logo span{color:white}
.hdr-date{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:rgba(255,255,255,0.75);text-transform:uppercase;letter-spacing:.06em;text-align:right}

.checker{height:10px;background-image:repeating-linear-gradient(90deg,var(--cream2) 0 10px,var(--red) 10px 20px)}

/* MAIN */
.main{max-width:700px;margin:0 auto;padding:20px 16px 60px}

/* HERO DO DIA */
.hero{background:var(--black);border-radius:20px;padding:20px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-20px;right:-20px;width:120px;height:120px;background:var(--yellow);opacity:.08;border-radius:50%}
.hero-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--yellow);margin-bottom:4px}
.hero-title{font-family:'Black Ops One',sans-serif;font-size:26px;color:white;line-height:1.1;margin-bottom:8px}
.hero-sub{font-size:13px;color:rgba(255,255,255,0.6);line-height:1.5}
.hero-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hbadge{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:20px}
.hbv{background:var(--red);color:white}
.hbc{background:var(--yellow);color:#5A3C00}
.hbs{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.85)}

/* PROGRESS */
.prog-wrap{background:white;border-radius:14px;padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray)}
.prog-pct{font-family:'Black Ops One',sans-serif;font-size:20px;color:var(--red)}
.prog-bar-bg{background:#EEE;border-radius:8px;height:8px;overflow:hidden}
.prog-bar{height:100%;border-radius:8px;background:var(--green);transition:width .4s}

/* TASK CARD */
.task-card{background:white;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.task-card-hdr{padding:12px 18px;display:flex;align-items:center;gap:10px}
.task-card-hdr.red{background:var(--red)}
.task-card-hdr.yellow{background:var(--yellow)}
.task-card-hdr.black{background:var(--black)}
.task-card-hdr.green{background:var(--green)}
.task-card-hdr.purple{background:#6B4FBB}
.task-card-hdr.blue{background:var(--blue)}
.tc-icon{font-size:20px}
.tc-title{font-family:'Black Ops One',sans-serif;font-size:15px;color:white;letter-spacing:.5px}
.task-card-hdr.yellow .tc-title{color:#3A2500}
.tc-reset{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.8);border:none;border-radius:6px;padding:3px 9px;cursor:pointer}
.task-card-hdr.yellow .tc-reset{color:rgba(0,0,0,0.4);background:rgba(0,0,0,0.08)}

/* TASK ROW */
.task-row{border-bottom:1px solid #F0EAE0;cursor:pointer;transition:background .15s}
.task-row:last-child{border-bottom:none}
.task-row:hover{background:#FFFAF5}
.task-row.done{opacity:.38}
.task-row-inner{display:flex;gap:12px;align-items:flex-start;padding:12px 18px}
.tcheck{width:22px;height:22px;border-radius:7px;border:2px solid #DDD;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:12px;color:white;transition:all .2s}
.done .tcheck{background:var(--green);border-color:var(--green)}
.ttext{font-size:13px;line-height:1.6;flex:1}
.done .ttext{text-decoration:line-through}

/* EXPANDABLE DETAIL */
.task-detail{display:none;padding:0 18px 14px 52px}
.task-detail.open{display:block}

/* PROMPT INLINE */
.prompt-inline{background:#1a1a1a;border-radius:10px;padding:12px 14px;margin-top:8px;position:relative}
.prompt-txt{font-family:monospace;font-size:11px;color:#C8F7B0;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.prompt-copy{position:absolute;top:8px;right:8px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;background:var(--yellow);color:#3A2500;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;transition:all .2s}
.prompt-copy:hover{background:#D4A832}
.prompt-copy.ok{background:var(--green);color:white}

/* WA BUBBLE INLINE */
.wa-inline{background:#DCF8C6;border-radius:12px 12px 4px 12px;padding:12px 14px;font-size:12px;line-height:1.7;color:#111;white-space:pre-wrap;margin-top:8px;word-break:break-word;position:relative}
.wa-copy-btn{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;background:#25D366;color:white;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;margin-top:6px;display:inline-block;transition:all .2s}
.wa-copy-btn:hover{background:#1aad55}
.wa-copy-btn.ok{background:#0F7A3E}

/* NOTE */
.note{font-size:12px;color:#555;line-height:1.6;padding:8px 10px;background:#FFF8EC;border-radius:8px;border-left:3px solid var(--yellow);margin-top:8px}
.note-blue{background:#EBF3FB;border-left-color:var(--blue);color:#0C3D6A}
.note-green{background:#E5F5EE;border-left-color:var(--green);color:#0A4028}
.note-purple{background:#F0ECFB;border-left-color:#6B4FBB;color:#3A2070}

/* LINK INPUT CARD */
.link-card{background:white;border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.link-card-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray)}
.link-input{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid #DDD;font-size:13px;font-family:'Barlow',sans-serif;outline:none;transition:border .2s}
.link-input:focus{border-color:var(--red)}
.link-row{display:flex;gap:8px}
.link-btn{flex:1;padding:10px;background:var(--red);color:white;border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:background .2s}
.link-btn:hover{background:var(--redd)}
.disc-row{display:flex;gap:8px;align-items:center}
.disc-input{width:80px;padding:10px 14px;border-radius:10px;border:1.5px solid #DDD;font-size:13px;font-family:'Barlow',sans-serif;outline:none;text-align:center}
.disc-label{font-size:13px;color:var(--gray)}

/* TIP */
.tip{background:var(--yellow);border-radius:14px;padding:14px 18px;font-size:13px;line-height:1.7;color:#4A2E00;margin-bottom:12px}
.tip strong{color:#2A1800}

/* SECTION DIVIDER */
.sdiv{font-family:'Black Ops One',sans-serif;font-size:16px;color:var(--red);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sdiv::after{content:'';flex:1;height:2px;background:var(--red);opacity:.15;border-radius:2px}

/* STORY MINI */
.story-mini{background:white;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.story-day-tag{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--red);margin-bottom:4px}
.story-hl{font-family:'Black Ops One',sans-serif;font-size:15px;color:var(--black);line-height:1.2;margin-bottom:8px}
.story-type-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;margin-bottom:8px}
.stt-foto{background:#E6F1FB;color:var(--blue)}
.stt-ai{background:#FFF3CD;color:#7A5200}
.stt-video{background:#FAECE7;color:#993C1D}
.story-inst{font-size:12px;color:#555;line-height:1.5}

@media(max-width:480px){
  .hero-title{font-size:22px}
  .main{padding:16px 12px 60px}
}
</style>
</head>
<body>

<div class="checker"></div>
<header class="hdr">
  <div class="hdr-in">
    <div class="logo">🍕 Quadrô <span>Pizza</span></div>
    <div class="hdr-date" id="hdr-date"></div>
  </div>
</header>

<main class="main">

<!-- LINK CONFIG -->
<div class="link-card">
  <div class="link-card-title">⚙️ Configurar uma vez só</div>
  <input class="link-input" id="portal-link" type="text" placeholder="🔗 Cole o link do portal de pedidos aqui" oninput="saveConfig()">
  <div class="link-row">
    <div class="disc-row" style="flex:1">
      <input class="disc-input" id="disc" type="number" min="1" max="50" placeholder="10" oninput="saveConfig()">
      <span class="disc-label">% desconto pós-avaliação</span>
    </div>
    <button class="link-btn" onclick="openPortal()">Abrir portal →</button>
  </div>
</div>

<!-- HERO -->
<div class="hero" id="hero-box">
  <div class="hero-label">Hoje é</div>
  <div class="hero-title" id="hero-title">Carregando...</div>
  <div class="hero-sub" id="hero-sub"></div>
  <div class="hero-badges" id="hero-badges"></div>
</div>

<!-- PROGRESSO -->
<div class="prog-wrap">
  <div class="prog-top">
    <div class="prog-label">Tarefas de hoje</div>
    <div class="prog-pct" id="prog-pct">0%</div>
  </div>
  <div class="prog-bar-bg"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
</div>

<!-- TASKS CONTAINER -->
<div id="tasks-container"></div>

</main>

<script>
// ─── CONFIG ───────────────────────────────────────────────
const PORTAL_KEY = 'qp_link';
const DISC_KEY   = 'qp_disc';
const TASK_KEY   = 'qp_tasks_';

function saveConfig(){
  localStorage.setItem(PORTAL_KEY, document.getElementById('portal-link').value);
  localStorage.setItem(DISC_KEY, document.getElementById('disc').value);
}
function loadConfig(){
  const l = localStorage.getItem(PORTAL_KEY)||'';
  const d = localStorage.getItem(DISC_KEY)||'10';
  document.getElementById('portal-link').value = l;
  document.getElementById('disc').value = d;
}
function getLink(){ return localStorage.getItem(PORTAL_KEY)||'[LINK DO PORTAL]'; }
function getDisc(){ return localStorage.getItem(DISC_KEY)||'10'; }
function openPortal(){
  const l = getLink();
  if(l && l !== '[LINK DO PORTAL]') window.open(l,'_blank');
  else alert('Cole o link do portal primeiro!');
}

// ─── DATE ─────────────────────────────────────────────────
const DAYS   = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS_S = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function today(){ return new Date(); }
function todayKey(){ const d=today(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function todayDow(){ return today().getDay(); } // 0=Dom

function setHeader(){
  const d = today();
  document.getElementById('hdr-date').innerHTML = DAYS_S[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()];
}

// ─── CAMPAIGN CALENDAR ────────────────────────────────────
// Keyed by "YYYY-M-D"
function dateKey(y,m,d){ return `${y}-${m}-${d}`; }

const CAMPAIGN = {
  // SEMANA 1
  [dateKey(2026,5,12)]: { type:'video', num:1, theme:'Abertura de temporada', desc:'Bastidores da montagem, "voltamos e o vício também". Grave de manhã antes de abrir.' },
  [dateKey(2026,5,13)]: { type:'card',  num:1, theme:'Agende e retire sem fila', desc:'CTA principal com QR e link do portal. Gere pela IA e publique.' },
  [dateKey(2026,5,14)]: { type:'video', num:2, theme:'ASMR corte da pizza quadrada', desc:'"Parece que não cabe mas cabe." Close no corte, som ambiente.' },
  [dateKey(2026,5,15)]: { type:'card',  num:2, theme:'Cardápio de sabores', desc:'Visual retro com cada sabor listado. Gere pela IA.' },
  [dateKey(2026,5,16)]: { type:'video', num:3, theme:'POV: você agendou, a fila te olhando', desc:'Humor + agendamento. Grave do ponto de vista de quem já retirou enquanto a fila espera.' },
  // SEMANA 2
  [dateKey(2026,5,19)]: { type:'video', num:4, theme:'O recreio é 15 min — agende ou passa fome', desc:'Humor + urgência. Mostre o relógio e a fila.' },
  [dateKey(2026,5,20)]: { type:'card',  num:3, theme:'Como funciona o agendamento', desc:'Passo a passo visual em 3 etapas. Gere pela IA.' },
  [dateKey(2026,5,21)]: { type:'video', num:5, theme:'Reação de aluno pegando a pizza', desc:'Testemunhal espontâneo. Peça permissão para gravar.' },
  [dateKey(2026,5,22)]: { type:'card',  num:4, theme:'Entrega para alunos do CAU', desc:'Alunos do CAU até 5º ano. Informar bloco, sala e ano no pedido.', cau:true },
  [dateKey(2026,5,23)]: { type:'video', num:6, theme:'Processo da pizza do início ao fim', desc:'Satisfying video. Do zero até a pizza pronta.' },
  // SEMANA 3
  [dateKey(2026,5,26)]: { type:'video', num:7, theme:'Antes/depois: fila vs agendado', desc:'Mostre os dois cenários — correria na fila vs pegar e ir.' },
  [dateKey(2026,5,27)]: { type:'card',  num:5, theme:'Combo da semana', desc:'Oferta especial com CTA de pedido. Edite o preço no Canva após gerar.' },
  [dateKey(2026,5,28)]: { type:'video', num:8, theme:'Já avaliou? Tem desconto te esperando', desc:'Mostra o fluxo de pós-venda e o cupom de desconto.' },
  [dateKey(2026,5,29)]: { type:'card',  num:6, theme:'Localização', desc:'Ao lado do Teatro UNIVALI — Bloco C2. Gere pela IA.' },
  [dateKey(2026,5,30)]: { type:'video', num:9, theme:'Encerramento do mês', desc:'Agradecimento + teaser do próximo período.' },
};

const VIDEO_DAYS = [1,3,5]; // Seg, Qua, Sex
const CARD_DAYS  = [2,4];   // Ter, Qui

// ─── PROMPTS ──────────────────────────────────────────────
const PROMPTS = {
  1: `Create a bold vertical social media card (1080x1350px) for a Brazilian square pizza brand called "Quadrô Pizza". Style: retro-bold, red background (#CC1F1F), cream checkered border pattern on sides. Top text in large yellow bold font: "O RECREIO É CURTO". Center text in huge white bold italic font: "AGENDE SUA PIZZA". Bottom accent: melting cheese drip graphic in yellow. Include a pizza slice mascot wearing sunglasses giving thumbs up (retro cartoon style). Bottom text: "Sem fila. Sem estresse." in white bold.`,
  2: `Design a retro-style square pizza menu card (1080x1080px) for "Quadrô Pizza". Cream/off-white background with red checkered pattern borders. Top: "NOSSOS SABORES" in bold yellow outlined font. Center: 4 square pizza slices illustrated in retro cartoon style, each with different toppings (pepperoni, margherita, portuguesa, calabresa). Each slice has a yellow label tag. Bottom: "Artesanal. Formato único. Preço acessível." in black bold. Retro diner meets Brazilian street food.`,
  3: `Create an infographic-style social media card (1080x1080px) for "Quadrô Pizza". Bold red background (#CC1F1F), cream checkered borders. Title: "COMO PEDIR ONLINE" in large yellow bold font. Center: 3 numbered steps in bold white text — Step 1: "Acesse o portal" phone icon, Step 2: "Escolha seu sabor e horário" pizza icon, Step 3: "Retire sem fila no recreio" checkmark icon. Retro cartoon mascot (pizza slice with sunglasses) pointing at the steps.`,
  4: `Create a fun friendly social media card (1080x1080px) for "Quadrô Pizza" targeting parents of children at UNIVALI CAU school up to 5th grade. Red background (#CC1F1F), cream checkered borders. Cartoon pizza mascot waving happily. Headline: "CHEGOU NA SALA DE AULA!" in large yellow bold. Below: 3 icons — backpack "Informe o bloco", door "Informe a sala", number "Informe o ano/turma". Bottom strip: "Peça no portal e a gente entrega!" in yellow on black.`,
  5: `Bold promotional card (1080x1080px) for "Quadrô Pizza". Dark background with yellow diagonal stripes. Center: two square pizza slices side by side with melting cheese. Text: "LEVA DOIS" in red bold outline, "PAGA MENOS" in white bold. Yellow price tag sticker. Cartoon mascot winking top corner. Bottom: "Combo disponível no portal de pedidos" in white. Retro 90s street food poster energy.`,
  6: `Location card (1080x1080px) for "Quadrô Pizza" at UNIVALI university. Red background (#CC1F1F), cream checkered side borders. Cartoon mascot pointing downward. Center: "ONDE ENCONTRAR A GENTE" in white bold. Map pin + "Ao lado do Teatro da UNIVALI — Bloco C2" in yellow bold. Clock + "Nos horários do intervalo" in white. Bottom black strip: "Peça online e retire sem fila" in yellow.`,
};

// Story prompts por dia da semana
const STORY_PROMPTS = {
  3: `Create a bold Instagram story (1080x1920px) for Quadrô Pizza. Red background (#CC1F1F), cream checkered borders. Large yellow bold text: "O RECREIO TEM 15 MIN". Center: giant countdown clock illustration. Below in huge white bold: "QUEM AGENDOU JÁ TÁ COMENDO". Pizza mascot running at bottom. Black strip: "Agende agora pelo portal" in yellow. Retro bold, high urgency.`,
  4: `Create a fun Instagram story (1080x1920px) for Quadrô Pizza targeting parents of young students at CAU school UNIVALI (up to 5th grade). Warm red background (#CC1F1F), cream checkered borders. Happy pizza mascot carrying pizza box. Large white bold text: "A PIZZA VAI ATÉ A SALA DO SEU FILHO!" Below in yellow bold: "CAU até o 5º ano — informe bloco, sala e ano". Bottom CTA in black: "Fazer pedido agora" in yellow.`,
  5: null, // foto
  1: null, // foto
  2: null, // foto
};

const STORY_DATA = {
  0: null,
  1: { hl:'🔥 SEMANA NOVA, VÍCIO VELHO. JÁ AGENDOU?', tipo:'foto', inst:'Foto da preparação de manhã — bancada, forno ligando, massa sendo aberta.', cta:'Link sticker: "Agendar pedido"' },
  2: { hl:'👀 SABOR DO DIA REVELADO — CORRE PRA PEDIR', tipo:'foto', inst:'Close na pizza do sabor especial. Escreva o nome do sabor em amarelo bold por cima no Instagram.', cta:'Escreva o nome do sabor + "🍕 Últimas unidades"' },
  3: { hl:'⏰ 15 MIN DE RECREIO. QUEM AGENDOU JÁ TÁ COMENDO.', tipo:'ai', inst:'Story gerado pela IA — copie o prompt abaixo, gere no ChatGPT e publique.', cta:'Adicionar sticker de link após gerar' },
  4: { hl:'🎒 ALUNOS DO CAU: A PIZZA VAI ATÉ VOCÊ!', tipo:'ai', inst:'Story especial para pais de alunos do CAU até 5º ano. Copie o prompt abaixo.', cta:'Adicionar sticker de link após gerar' },
  5: { hl:'😎 FECHA A SEMANA COM GOSTO. ÚLTIMA CHANCE HOJE!', tipo:'foto', inst:'Foto da pizza sendo entregue ou aluno satisfeito (peça permissão).', cta:'"Última chamada hoje 🍕" + link do portal' },
  6: null,
};

// WA messages
function waBoasVindas(){
  return `🍕 *Eii, bem-vindo à Quadrô Pizza!*\n\nA pizza quadrada artesanal que virou vício na UNIVALI 😎✨\n\n👇 Faça seu pedido online agora e *retire sem fila no recreio:*\n🔗 ${getLink()}\n\n📍 Ao lado do Teatro da UNIVALI — Bloco C2\n⏰ Disponível nos horários de intervalo\n\n_Escolha uma opção:_\n*1* — Ver sabores 🍕\n*2* — Ver combos 💰\n*3* — Como funciona o agendamento 📲\n*4* — Entrega para alunos do CAU 🎒\n*5* — Horário e localização 📍\n*6* — Falar com a gente 💬`;
}
function waCau(){
  return `🎒 *Entrega para alunos do CAU até o 5º ano!* 🍕\n\nTemos uma opção especial para os pequenos da UNIVALI 😍\n\nNa hora de fazer o pedido pelo portal, informe:\n📌 *Bloco* da sala\n🚪 *Número da sala*\n🎓 *Ano da turma* (disponível até o 5º ano)\n\nE a pizza chega certinha na hora do intervalo! 🎉\n\n👇 Faça o pedido agora:\n🔗 ${getLink()}\n\nQualquer dúvida é só chamar! 💛`;
}
function waPosVenda(){
  return `Eii, [Nome]! 🍕😎\n\nEspero que tenha curtido sua Quadrô hoje!\n\n⭐ Você recebeu um link de avaliação no portal — leva menos de 1 minuto e nos ajuda demais!\n\n📲 Ainda não segue a gente no Instagram?\n👉 @quadropizza\n\nLá a gente posta sabores do dia, ofertas e novidades que só quem segue fica sabendo 👀`;
}
function waCupom(){
  const d = getDisc();
  return `🎉 *Valeu por avaliar, [Nome]!*\n\nSua opinião é muito importante pra gente 💛\n\nComo agradecimento, você ganhou:\n\n🏷️ *${d}% de desconto no próximo pedido*\n📌 Código: *QUADRO${d}*\n📅 Válido por 7 dias\n\n👇 Use no portal na hora de fechar:\n🔗 ${getLink()}\n\nAté a próxima! 🍕😎`;
}
function waAgendamento(){
  return `📲 *Como funciona o agendamento?*\n\nÉ super simples!\n\n*1️⃣* Acesse: 🔗 ${getLink()}\n*2️⃣* Escolha seu sabor 🍕\n*3️⃣* Selecione o horário ⏰\n*4️⃣* Finalize — e pronto! ✅\n\n📦 Sua pizza fica no seu nome. Chegue e pegue *sem fila no recreio!*\n\n❓ *Dúvidas:*\n• _Posso escolher o horário?_ Sim! 🕐\n• _Qualquer curso?_ Sim, todos! 🎓\n• _Como sei que ficou pronto?_ Confirmação pelo portal 📲`;
}

// ─── BUILD PAGE ───────────────────────────────────────────
function build(){
  loadConfig();
  setHeader();
  const d   = today();
  const dow = d.getDay();
  const dk  = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  const cam = CAMPAIGN[dk] || null;
  const isWeekday = dow >= 1 && dow <= 5;

  // Hero
  const heroTitle = document.getElementById('hero-title');
  const heroSub   = document.getElementById('hero-sub');
  const heroBadges= document.getElementById('hero-badges');

  heroTitle.textContent = DAYS[dow] + ', ' + d.getDate() + ' de ' + MONTHS[d.getMonth()];

  let badges = [];
  if(cam && cam.type==='video') badges.push('<span class="hbadge hbv">🎬 Vídeo '+cam.num+' hoje</span>');
  if(cam && cam.type==='card')  badges.push('<span class="hbadge hbc">🖼️ Card '+cam.num+' hoje</span>');
  if(isWeekday) badges.push('<span class="hbadge hbs">📱 Story obrigatório</span>');
  if(isWeekday) badges.push('<span class="hbadge hbs">💬 Pós-venda WA</span>');
  heroBadges.innerHTML = badges.join('');

  if(!isWeekday){
    heroSub.textContent = 'Fim de semana — descanse! Prepare os vídeos e cards para a semana de segunda.';
  } else if(cam){
    heroSub.textContent = cam.theme + ' — ' + cam.desc;
  } else {
    heroSub.textContent = 'Dia de operação e stories. Sem vídeo nem card hoje — foque nos agendamentos!';
  }

  // Build tasks
  const container = document.getElementById('tasks-container');
  container.innerHTML = '';

  if(!isWeekday){
    container.innerHTML = `<div class="tip" style="margin-top:0"><strong>🌟 Fim de semana!</strong> Aproveite para gravar os vídeos da próxima semana com calma e gerar os cards com IA antes de segunda.</div>`;
    return;
  }

  // ── BLOCO 1: MANHÃ ──
  const manha = makeTaskCard('red','☀️','MANHÃ — antes de abrir','manha', [
    { txt:'📸 Tirar 1 foto da pizza, bancada ou preparação do dia', detail: makeNote('Serve qualquer ângulo — pizza pronta, forno ligando, bancada organizada. Esta foto vai no story de hoje.') },
    { txt:'📱 Postar o story do dia com headline + sticker de link', detail: makeStoryBlock(dow) },
    { txt:'📋 Ver pedidos agendados no portal para o intervalo de hoje', detail: makeNote(`Acesse o portal → verifique nome, sabor e horário de cada pedido agendado.`, 'blue') },
    { txt:'🍕 Separar os pedidos agendados com o nome de cada cliente', detail: makeNote('Deixe separado antes do intervalo. Quem agendou retira na frente, sem fila.') },
  ]);
  container.appendChild(manha);

  // ── BLOCO 2: CONTEÚDO DO DIA ──
  if(cam){
    let detail = '';
    if(cam.type === 'video'){
      detail = `<div class="note note-blue" style="margin-bottom:8px">🎬 <strong>Vídeo ${cam.num}:</strong> ${cam.desc}</div>
      <div class="note">💡 Dica: grave de manhã antes de abrir ou no horário que tiver mais movimento. Edite no CapCut e publique no TikTok + Reels no mesmo dia.</div>`;
    } else {
      const promptTxt = PROMPTS[cam.num] || 'Prompt não encontrado.';
      detail = `<div class="note note-blue" style="margin-bottom:8px">🖼️ <strong>Card ${cam.num}:</strong> ${cam.desc}</div>
      <div style="font-size:12px;color:var(--gray);margin-bottom:6px">📌 Cole o prompt abaixo no <strong>ChatGPT</strong> ou <strong>Adobe Firefly</strong> para gerar o card:</div>
      ${makePrompt(promptTxt, 'p_cam')}
      <div class="note note-green" style="margin-top:8px">✅ Após gerar: ajuste textos no Canva se precisar → publique no feed (1080x1080) → compartilhe nos stories também!</div>
      ${cam.cau ? `<div class="note note-purple" style="margin-top:8px">🎒 <strong>Card especial CAU:</strong> para pais e alunos do CAU até 5º ano. Mencione que o pedido precisa de bloco, sala e ano da turma.</div>` : ''}`;
    }
    const conteudo = makeTaskCard(cam.type==='video'?'black':'yellow',
      cam.type==='video'?'🎬':'🖼️',
      cam.type==='video'?`VÍDEO ${cam.num} — GRAVAR E PUBLICAR`:`CARD ${cam.num} — GERAR E PUBLICAR`,
      'conteudo', [
        { txt: cam.type==='video' ? `Gravar: "${cam.theme}"` : `Gerar com IA: "${cam.theme}"`, detail },
        { txt: cam.type==='video' ? 'Editar no CapCut e publicar no TikTok + Reels' : 'Publicar no feed do Instagram', detail: makeNote('Formato feed: 1080x1080. Reels: vertical 9:16. Publique e compartilhe nos stories!') },
      ]);
    container.appendChild(conteudo);
  }

  // ── BLOCO 3: INTERVALO ──
  const intervalo = makeTaskCard('red','⚡','INTERVALO — na hora da entrega','intervalo', [
    { txt:'✅ Entregar pedidos agendados primeiro — clientes retiram no nome', detail: makeNote('Quem agendou não precisa esperar na fila. Tenha os pedidos separados e prontos antes do intervalo.') },
    { txt:'🎒 Enviar entregas do CAU (bloco + sala + ano) antes do sinal', detail: makeNote('Verifique os pedidos CAU com antecedência. Separe por sala para agilizar a entrega.', 'purple') },
  ]);
  container.appendChild(intervalo);

  // ── BLOCO 4: PÓS-INTERVALO ──
  const pos = makeTaskCard('green','🌅','PÓS-INTERVALO','pos', [
    { txt:'💬 Enviar pós-venda no WhatsApp para quem comprou hoje', detail: `<div style="font-size:12px;color:var(--gray);margin-bottom:6px">Copie e envie para cada cliente do dia:</div>${makeWA(waPosVenda(),'wa_pos')}` },
    { txt:'⭐ Verificar avaliações no portal e enviar cupons de desconto', detail: `<div style="font-size:12px;color:var(--gray);margin-bottom:6px">Para quem avaliou, envie este cupom:</div>${makeWA(waCupom(),'wa_cup')}` },
  ]);
  container.appendChild(pos);

  // ── BLOCO 5: WA AUTOMÁTICO ──
  const wa = makeTaskCard('blue','💬','WHATSAPP — MENSAGENS PRONTAS','wa', [
    { txt:'Boas-vindas automática (configurar 1x no WA Business)', detail: `${makeWA(waBoasVindas(),'wa_bv')}` },
    { txt:'Como funciona o agendamento (opção 3)', detail: `${makeWA(waAgendamento(),'wa_ag')}` },
    { txt:'Entrega para alunos do CAU (opção 4)', detail: `${makeWA(waCau(),'wa_cau')}` },
  ]);
  container.appendChild(wa);

  // ── TIP ──
  const tip = document.createElement('div');
  tip.className = 'tip';
  tip.innerHTML = `<strong>🏆 Regra de ouro:</strong> Em TODO conteúdo — vídeo, card ou story — sempre mencione que dá pra <strong>agendar a retirada</strong>. Quanto mais agendamentos, menos correria no intervalo pra você também! 😎`;
  container.appendChild(tip);

  // Update progress
  updateProgress();
}

// ─── HELPERS ──────────────────────────────────────────────
function makeNote(txt, color=''){
  return `<div class="note${color?' note-'+color:''}">${txt}</div>`;
}

function makePrompt(txt, id){
  return `<div class="prompt-inline"><button class="prompt-copy" onclick="cpPrompt(this,'${id}')">Copiar</button><div class="prompt-txt" id="${id}">${txt}</div></div>`;
}

function makeWA(txt, id){
  return `<div class="wa-inline" id="${id}">${txt}</div><button class="wa-copy-btn" onclick="cpWA(this,'${id}')">Copiar mensagem</button>`;
}

function makeStoryBlock(dow){
  const s = STORY_DATA[dow];
  if(!s) return makeNote('Hoje não é dia de semana — sem story.');
  
  let tipo = s.tipo === 'foto' ? `<span class="story-type-tag stt-foto">📸 Foto tirada na hora</span>` : `<span class="story-type-tag stt-ai">🤖 Gerado pela IA</span>`;

  let promptBlock = '';
  if(s.tipo === 'ai' && STORY_PROMPTS[dow]){
    promptBlock = `<div style="font-size:12px;color:var(--gray);margin:8px 0 4px">📌 Prompt para gerar o story — cole no ChatGPT:</div>${makePrompt(STORY_PROMPTS[dow],'sp_'+dow)}`;
  }

  return `<div class="story-mini" style="margin-top:0;box-shadow:none;padding:10px 0">
    ${tipo}
    <div class="story-hl">${s.hl}</div>
    <div class="story-inst">${s.inst}</div>
    ${promptBlock}
    <div class="note" style="margin-top:8px">📌 ${s.cta} — sempre adicionar o link do portal como sticker!</div>
  </div>`;
}

function makeTaskCard(color, icon, title, group, tasks){
  const div = document.createElement('div');
  div.className = 'task-card';
  
  const stKey = TASK_KEY + todayKey() + '_' + group;
  const saved = JSON.parse(localStorage.getItem(stKey)||'{}');

  let hdrHtml = `<div class="task-card-hdr ${color}"><div class="tc-icon">${icon}</div><div class="tc-title">${title}</div><button class="tc-reset" onclick="resetGroup('${stKey}',this)">Resetar</button></div>`;
  
  let rowsHtml = '';
  tasks.forEach((task, i) => {
    const isDone = saved[i] || false;
    rowsHtml += `<div class="task-row${isDone?' done':''}" onclick="toggleRow(this,'${stKey}',${i})">
      <div class="task-row-inner">
        <div class="tcheck">${isDone?'✓':''}</div>
        <div class="ttext">${task.txt}</div>
        ${task.detail ? '<div style="font-size:18px;color:#CCC;margin-left:auto">›</div>' : ''}
      </div>
      ${task.detail ? `<div class="task-detail">${task.detail}</div>` : ''}
    </div>`;
  });

  div.innerHTML = hdrHtml + rowsHtml;
  return div;
}

// ─── INTERACTIONS ─────────────────────────────────────────
function toggleRow(row, stKey, idx){
  // If clicking on the row itself, toggle expand AND check
  row.classList.toggle('done');
  const detail = row.querySelector('.task-detail');
  if(detail){
    // First click: expand. If already expanded + done, collapse.
    if(!detail.classList.contains('open')){
      detail.classList.add('open');
      if(!row.classList.contains('done')) row.classList.add('done');
    } else {
      detail.classList.remove('open');
    }
  }
  // Save state
  const stKey2 = stKey;
  const saved = JSON.parse(localStorage.getItem(stKey2)||'{}');
  saved[idx] = row.classList.contains('done');
  localStorage.setItem(stKey2, JSON.stringify(saved));
  updateProgress();
}

function resetGroup(stKey, btn){
  localStorage.removeItem(stKey);
  build();
}

function updateProgress(){
  const all  = document.querySelectorAll('.task-row');
  const done = document.querySelectorAll('.task-row.done');
  const pct  = all.length ? Math.round(done.length/all.length*100) : 0;
  document.getElementById('prog-bar').style.width = pct+'%';
  document.getElementById('prog-pct').textContent = pct+'%';
}

function cpPrompt(btn, id){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='Copiado ✓'; btn.classList.add('ok');
    setTimeout(()=>{ btn.textContent='Copiar'; btn.classList.remove('ok'); },2200);
  });
}

function cpWA(btn, id){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='Copiado ✓'; btn.classList.add('ok');
    setTimeout(()=>{ btn.textContent='Copiar mensagem'; btn.classList.remove('ok'); },2200);
  });
}

// ─── INIT ─────────────────────────────────────────────────
build();
</script>
